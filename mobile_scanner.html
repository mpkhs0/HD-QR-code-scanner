<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAG 스캐너</title>
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2235;
    --accent: #00d4aa;
    --accent2: #0099ff;
    --danger: #ff4757;
    --warn: #ffa502;
    --text: #e8f0fe;
    --text2: #8a9bb5;
    --border: #1e2d45;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 13px;
    font-weight: bold;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .stats-bar {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text2);
  }
  .stat-item span { color: var(--accent); font-weight: bold; }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text2);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .page { display: none; flex: 1; overflow-y: auto; padding: 16px; }
  .page.active { display: block; }

  /* SCAN PAGE */
  .camera-container {
    position: relative;
    width: 100%;
    max-width: 400px;
    margin: 0 auto 16px;
    border-radius: var(--radius);
    overflow: hidden;
    background: #000;
    aspect-ratio: 1;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .scan-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .scan-frame {
    width: 60%;
    height: 60%;
    border: 2px solid var(--accent);
    border-radius: 8px;
    position: relative;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
  }
  .scan-frame::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    animation: scanLine 2s linear infinite;
    box-shadow: 0 0 8px var(--accent);
  }
  @keyframes scanLine {
    0% { top: 0; } 100% { top: 100%; }
  }
  .corner {
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: var(--accent);
    border-style: solid;
  }
  .corner-tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
  .corner-tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
  .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
  .corner-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:active { transform: scale(0.97); opacity: 0.85; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-warn { background: var(--warn); color: #000; }
  .btn-small {
    width: auto;
    padding: 8px 14px;
    font-size: 11px;
  }

  /* RESULT TOAST */
  #result-toast {
    position: fixed;
    bottom: 80px;
    left: 16px;
    right: 16px;
    z-index: 200;
    border-radius: var(--radius);
    padding: 16px;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }
  #result-toast.show { transform: translateY(0); opacity: 1; }
  #result-toast.success { background: var(--accent); color: #000; }
  #result-toast.duplicate { background: var(--warn); color: #000; }
  #result-toast.unknown { background: var(--danger); color: #fff; }

  /* MANUAL INPUT */
  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 6px; letter-spacing: 1px; }
  .input-group input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 14px;
  }
  .input-group input:focus { outline: none; border-color: var(--accent); }

  /* REGISTER LIST */
  .section-title {
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .register-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .register-item .tag-id {
    flex: 1;
    font-size: 13px;
    font-weight: bold;
    color: var(--accent);
  }
  .register-item .tag-meta {
    font-size: 10px;
    color: var(--text2);
    margin-top: 2px;
  }
  .register-item .scan-time {
    font-size: 10px;
    color: var(--text2);
    text-align: right;
    white-space: nowrap;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
  }
  .badge-done { background: rgba(0,212,170,0.15); color: var(--accent); border: 1px solid var(--accent); }
  .badge-type { background: rgba(0,153,255,0.15); color: var(--accent2); border: 1px solid var(--accent2); font-size: 9px; }

  /* SETTINGS PAGE */
  .card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .label { color: var(--text2); }
  .info-row .value { color: var(--text); font-weight: bold; }

  /* PROGRESS */
  .progress-wrap { background: var(--border); border-radius: 4px; height: 6px; margin: 8px 0; }
  .progress-bar {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.5s ease;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text2);
    font-size: 12px;
    line-height: 2;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

  .divider { height: 1px; background: var(--border); margin: 12px 0; }

  #canvas { display: none; }

  .scanner-status {
    text-align: center;
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  .scanner-status .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--danger);
    margin-right: 6px;
    animation: pulse 1s infinite;
  }
  .scanner-status.active .dot { background: var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .gap-8 { display: flex; flex-direction: column; gap: 8px; }

  /* Search */
  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }

  .filter-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-tab {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    border: 1px solid var(--border);
    color: var(--text2);
    background: var(--surface2);
    transition: all 0.15s;
  }
  .filter-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,170,0.1); }
</style>
</head>
<body>

<header>
  <div class="logo">⬡ TAG SCANNER</div>
  <div class="stats-bar">
    <div class="stat-item">스캔 <span id="hdr-scanned">0</span></div>
    <div class="stat-item">완료 <span id="hdr-total">0</span></div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('scan')">📷 스캔</div>
  <div class="tab" onclick="switchTab('register')">📋 레지스터</div>
  <div class="tab" onclick="switchTab('settings')">⚙️ 설정</div>
</div>

<!-- SCAN PAGE -->
<div class="page active" id="page-scan">
  <div class="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-overlay">
      <div class="scan-frame">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
      </div>
    </div>
  </div>

  <div class="scanner-status" id="scanner-status">
    <span class="dot"></span>카메라 대기 중
  </div>

  <div class="gap-8">
    <button class="btn btn-primary" id="btn-camera" onclick="toggleCamera()">📷 카메라 시작</button>
  </div>

  <div class="divider"></div>

  <div class="input-group">
    <label>수동 입력 (TAG 번호 직접 입력)</label>
    <input type="text" id="manual-input" placeholder="101290-ABJ-20640" autocomplete="off" autocapitalize="characters">
  </div>
  <button class="btn btn-secondary" onclick="manualScan()">✓ 수동 등록</button>
</div>

<!-- REGISTER PAGE -->
<div class="page" id="page-register">
  <div class="section-title">
    <span>스캔 레지스터</span>
    <button class="btn btn-small btn-secondary" onclick="clearRegister()">초기화</button>
  </div>

  <input type="text" class="search-input" id="search-input" placeholder="TAG 검색..." oninput="renderRegister()">

  <div class="filter-tabs">
    <div class="filter-tab active" onclick="setFilter('all', this)">전체</div>
    <div class="filter-tab" onclick="setFilter('scanned', this)">스캔완료</div>
    <div class="filter-tab" onclick="setFilter('pending', this)">미스캔</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
  <div style="font-size:11px; color:var(--text2); text-align:right; margin-bottom:12px;">
    <span id="progress-text">0 / 0 완료</span>
  </div>

  <div id="register-list"></div>
</div>

<!-- SETTINGS PAGE -->
<div class="page" id="page-settings">
  <div class="card">
    <div class="card-title">📊 현황</div>
    <div class="info-row"><span class="label">전체 TAG</span><span class="value" id="s-total">-</span></div>
    <div class="info-row"><span class="label">스캔 완료</span><span class="value" id="s-scanned">-</span></div>
    <div class="info-row"><span class="label">잔여</span><span class="value" id="s-remain">-</span></div>
    <div class="info-row"><span class="label">진행률</span><span class="value" id="s-pct">-</span></div>
  </div>

  <div class="card">
    <div class="card-title">📤 내보내기</div>
    <div class="gap-8">
      <button class="btn btn-primary" onclick="exportCSV()">스캔 레지스터 CSV 내보내기</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📥 마스터리스트 불러오기</div>
    <p style="font-size:11px; color:var(--text2); margin-bottom:12px; line-height:1.6;">
      서버에서 내보낸 마스터리스트 CSV를 불러오면,<br>
      이미 완료된 TAG 스캔 시 경고 메시지가 표시됩니다.
    </p>
    <input type="file" id="master-file" accept=".csv" style="display:none" onchange="importMaster(event)">
    <button class="btn btn-secondary" onclick="document.getElementById('master-file').click()">마스터리스트 CSV 선택</button>
    <div style="font-size:11px; color:var(--text2); margin-top:8px;" id="master-status">불러온 마스터리스트 없음</div>
  </div>

  <div class="card">
    <div class="card-title">👤 스캐너 정보</div>
    <div class="input-group">
      <label>스캐너 이름 (작업자명)</label>
      <input type="text" id="scanner-name" placeholder="홍길동" oninput="saveScannerName()">
    </div>
  </div>

  <div class="card">
    <div class="card-title">⚠️ 초기화</div>
    <button class="btn btn-danger" onclick="resetAll()">전체 데이터 초기화</button>
  </div>
</div>

<!-- TOAST -->
<div id="result-toast"></div>

// ─── STATE ─────────────────────────────────────────────────────────
const tagMap = {};
MASTER_TAGS.forEach(t => tagMap[t.TAG] = t);

let scanRegister = {}; // TAG -> {TAG, TYPE, RFQ NO, Discipline, scanTime, scanner, status}
let masterCompleted = {}; // TAG -> true (서버 마스터리스트에서 완료된 것)
let cameraActive = false;
let videoStream = null;
let scanCooldown = false;
let currentFilter = 'all';

// ─── LOCALSTORAGE ──────────────────────────────────────────────────
function saveState() {
  try {
    localStorage.setItem('qr_register', JSON.stringify(scanRegister));
    localStorage.setItem('qr_master_completed', JSON.stringify(masterCompleted));
    localStorage.setItem('qr_scanner_name', document.getElementById('scanner-name').value || '');
  } catch(e) {}
}

function loadState() {
  try {
    const r = localStorage.getItem('qr_register');
    if (r) scanRegister = JSON.parse(r);
    const m = localStorage.getItem('qr_master_completed');
    if (m) masterCompleted = JSON.parse(m);
    const n = localStorage.getItem('qr_scanner_name');
    if (n) document.getElementById('scanner-name').value = n;
    const masterInfo = localStorage.getItem('qr_master_info');
    if (masterInfo) document.getElementById('master-status').textContent = masterInfo;
  } catch(e) {}
}

function saveScannerName() { saveState(); }

// ─── CAMERA ────────────────────────────────────────────────────────
async function toggleCamera() {
  if (cameraActive) {
    stopCamera();
  } else {
    await startCamera();
  }
}

let zxingReader = null;

async function startCamera() {
  try {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zxingReader = new ZXing.BrowserQRCodeReader(hints);

    const video = document.getElementById('video');
    cameraActive = true;
    document.getElementById('btn-camera').textContent = '⏹ 카메라 중지';
    const status = document.getElementById('scanner-status');
    status.className = 'scanner-status active';
    status.innerHTML = '<span class="dot"></span>스캔 중...';

    await zxingReader.decodeFromConstraints(
      { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } },
      video,
      (result, err) => {
        if (result && !scanCooldown) {
          processTag(result.getText().trim());
          scanCooldown = true;
          setTimeout(() => { scanCooldown = false; }, 2500);
        }
      }
    );
  } catch(e) {
    showToast('카메라 접근 권한이 필요합니다.', 'unknown');
    cameraActive = false;
    document.getElementById('btn-camera').textContent = '📷 카메라 시작';
  }
}

function stopCamera() {
  if (zxingReader) {
    zxingReader.reset();
    zxingReader = null;
  }
  cameraActive = false;
  document.getElementById('btn-camera').textContent = '📷 카메라 시작';
  const status = document.getElementById('scanner-status');
  status.className = 'scanner-status';
  status.innerHTML = '<span class="dot"></span>카메라 대기 중';
}

// ─── TAG PROCESSING ────────────────────────────────────────────────
function processTag(tagId) {
  const tag = tagId.toUpperCase().trim();

  // 마스터에 없는 TAG
  if (!tagMap[tag]) {
    showToast(`❌ 미등록 TAG\n${tag}`, 'unknown');
    vibrate([100, 50, 100]);
    return;
  }

  // 서버 마스터리스트에서 이미 완료된 TAG
  if (masterCompleted[tag]) {
    showToast(`⚠️ 기 완료된 TAG입니다.\n${tag}`, 'duplicate');
    vibrate([200, 100, 200]);
    return;
  }

  // 이미 이번 세션에서 스캔한 TAG
  if (scanRegister[tag]) {
    const prev = scanRegister[tag].scanTime;
    showToast(`⚠️ 이미 스캔한 TAG입니다.\n${tag}\n(${prev})`, 'duplicate');
    vibrate([200, 100, 200]);
    return;
  }

  // 새 스캔
  const info = tagMap[tag];
  const now = new Date();
  const timeStr = now.toLocaleString('ko-KR', { year:'2-digit', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const scannerName = document.getElementById('scanner-name').value || '미지정';

  scanRegister[tag] = {
    TAG: tag,
    TYPE: info.TYPE,
    'RFQ NO': info['RFQ NO'],
    Discipline: info.Discipline,
    scanTime: timeStr,
    scanner: scannerName,
    status: '완료'
  };

  saveState();
  updateHeader();
  showToast(`✅ 스캔 완료!\n${tag}\n${info.TYPE}`, 'success');
  vibrate([50]);
}

function manualScan() {
  const val = document.getElementById('manual-input').value.trim().toUpperCase();
  if (!val) return;
  processTag(val);
  document.getElementById('manual-input').value = '';
}

document.getElementById('manual-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') manualScan();
});

// ─── UI ────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['scan','register','settings'][i] === name);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${name}`).classList.add('active');
  if (name === 'register') renderRegister();
  if (name === 'settings') updateSettings();
}

function showToast(msg, type) {
  const t = document.getElementById('result-toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  setTimeout(() => { t.className = ''; }, 2500);
}

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

function updateHeader() {
  const scanned = Object.keys(scanRegister).length;
  const total = Object.keys(masterCompleted).length + scanned;
  document.getElementById('hdr-scanned').textContent = scanned;
  document.getElementById('hdr-total').textContent = MASTER_TAGS.length;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderRegister();
}

function renderRegister() {
  const search = document.getElementById('search-input').value.trim().toUpperCase();
  const list = document.getElementById('register-list');

  // Merge: master completed + session scanned
  const allItems = MASTER_TAGS.map(t => {
    const done = scanRegister[t.TAG] || (masterCompleted[t.TAG] ? { ...t, scanTime: '서버 완료', scanner: '-', status: '완료(서버)' } : null);
    return { info: t, scan: done };
  });

  const filtered = allItems.filter(item => {
    if (search && !item.info.TAG.includes(search)) return false;
    if (currentFilter === 'scanned' && !item.scan) return false;
    if (currentFilter === 'pending' && item.scan) return false;
    return true;
  });

  const scannedCount = Object.keys(scanRegister).length + Object.keys(masterCompleted).length;
  const pct = Math.round(scannedCount / MASTER_TAGS.length * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${scannedCount} / ${MASTER_TAGS.length} 완료 (${pct}%)`;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📭</div>결과 없음</div>';
    return;
  }

  list.innerHTML = filtered.map(item => {
    const isDone = !!item.scan;
    const isServerDone = masterCompleted[item.info.TAG];
    return `<div class="register-item">
      <div style="flex:1">
        <div class="tag-id">${item.info.TAG}</div>
        <div class="tag-meta">
          <span class="badge badge-type">${item.info.TYPE}</span>
          &nbsp;${item.info['RFQ NO']}
        </div>
        ${isDone ? `<div class="tag-meta" style="margin-top:4px;">👤 ${item.scan.scanner || '-'}</div>` : ''}
      </div>
      <div style="text-align:right">
        ${isDone ? `<span class="badge badge-done">${isServerDone ? '서버완료' : '완료'}</span>` : '<span style="color:var(--text2);font-size:11px;">미완료</span>'}
        ${isDone ? `<div class="scan-time">${item.scan.scanTime || ''}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function updateSettings() {
  const scanned = Object.keys(scanRegister).length + Object.keys(masterCompleted).length;
  const remain = MASTER_TAGS.length - scanned;
  const pct = Math.round(scanned / MASTER_TAGS.length * 100);
  document.getElementById('s-total').textContent = MASTER_TAGS.length;
  document.getElementById('s-scanned').textContent = scanned;
  document.getElementById('s-remain').textContent = remain;
  document.getElementById('s-pct').textContent = pct + '%';
}

// ─── CSV EXPORT ────────────────────────────────────────────────────
function exportCSV() {
  if (Object.keys(scanRegister).length === 0) {
    alert('스캔된 TAG가 없습니다.');
    return;
  }
  const headers = ['TAG', 'TYPE', 'RFQ NO', 'Discipline', '스캔일시', '스캐너', '상태'];
  const rows = Object.values(scanRegister).map(r =>
    [r.TAG, r.TYPE, r['RFQ NO'], r.Discipline, r.scanTime, r.scanner, r.status]
      .map(v => `"${v}"`).join(',')
  );
  const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date().toISOString().slice(0,16).replace('T','_').replace(':','');
  a.href = url;
  a.download = `scan_register_${now}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ─── MASTER IMPORT ─────────────────────────────────────────────────
function importMaster(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) { alert('유효하지 않은 파일입니다.'); return; }

    const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim());
    const tagIdx = headers.findIndex(h => h === 'TAG');
    const statusIdx = headers.findIndex(h => h === '상태' || h === 'status');

    if (tagIdx < 0) { alert('TAG 컬럼을 찾을 수 없습니다.'); return; }

    masterCompleted = {};
    let count = 0;
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',').map(c => c.replace(/"/g,'').trim());
      const tag = cols[tagIdx];
      const status = statusIdx >= 0 ? cols[statusIdx] : '완료';
      if (tag && (status === '완료' || status === 'done' || status === '완료(서버)')) {
        masterCompleted[tag] = true;
        count++;
      }
    }

    const info = `✅ 마스터리스트 로드 완료 (${count}건, ${new Date().toLocaleString('ko-KR')})`;
    document.getElementById('master-status').textContent = info;
    localStorage.setItem('qr_master_info', info);
    saveState();
    updateHeader();
    alert(`마스터리스트 ${count}건 로드 완료`);
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}

function clearRegister() {
  if (!confirm('이번 세션 스캔 기록을 초기화할까요?\n(마스터리스트는 유지됩니다)')) return;
  scanRegister = {};
  saveState();
  updateHeader();
  renderRegister();
}

function resetAll() {
  if (!confirm('⚠️ 모든 데이터(스캔기록+마스터리스트)를 초기화합니다.\n계속하시겠습니까?')) return;
  scanRegister = {};
  masterCompleted = {};
  localStorage.clear();
  document.getElementById('master-status').textContent = '불러온 마스터리스트 없음';
  updateHeader();
  alert('초기화 완료');
}

// ─── INIT ──────────────────────────────────────────────────────────
loadState();
updateHeader();
</script>
